name: Ultimate Stealth Sync Center

on:
  schedule:
    - cron: '0 * * * *' # 自動巡邏
  workflow_dispatch: # 允許手動觸發

concurrency:
  group: sync-center-group
  cancel-in-progress: true

permissions:
  contents: write # 授權寫入，確保 Commit 與 Release 順利運作

jobs:
  auto-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stealth Auto-Sync
        run: |
          # 1. 驗證並登入 GitHub CLI
          if [ -z "${{ secrets.YOUR_CUSTOM_PAT }}" ]; then
            echo "錯誤：找不到 YOUR_CUSTOM_PAT"
            exit 1
          fi
          echo "${{ secrets.YOUR_CUSTOM_PAT }}" | gh auth login --with-token

          echo "=== 開始檢查所有 Fork 專案 (V4.6) ==="
          REPOS=$(gh repo list --fork --limit 100 --json nameWithOwner --jq '.[].nameWithOwner')

          if [ -z "$REPOS" ]; then
            echo "帳號下目前沒有任何 Fork 專案。"
            exit 0
          fi

          TOTAL_COUNT=$(echo "$REPOS" | wc -l)
          echo "總共偵測到 $TOTAL_COUNT 個專案，開始處理..."
          echo "=========================================="

          while read -r TGT_REPO; do
            if [ -z "$TGT_REPO" ]; then continue; fi

            echo "[專案] $TGT_REPO"

            # A-1. 檢查原專案是否內建 Workflow 腳本
            WF_INFO=$(gh api "repos/$TGT_REPO/actions/workflows" 2>/dev/null || echo "")
            WF_COUNT=$(echo "$WF_INFO" | jq -r '.total_count // 0' 2>/dev/null || echo 0)

            if [ "$WF_COUNT" -gt 0 ]; then
              WF_NAMES=$(echo "$WF_INFO" | jq -r '.workflows[].name' | paste -sd ", " -)
              echo "  -> 原專案 Workflow ($WF_COUNT 個): $WF_NAMES"
            else
              echo "  -> 原專案 Workflow: 無"
            fi

            # A-2. 自動停用目標 Fork 專案的 Actions 功能，避免對方 Workflow 跑失敗或浪費額度
            gh api -X PUT "repos/$TGT_REPO/actions/permissions" -F enabled=false >/dev/null 2>&1 || true
            echo "  -> Actions 開關：已自動鎖定/停用"

            SRC_REPO=$(gh api "repos/$TGT_REPO" --jq '.parent.full_name' 2>/dev/null || echo "")
            if [ -z "$SRC_REPO" ] || [ "$SRC_REPO" = "null" ]; then
              echo "  -> 找不到原作者倉庫資訊，跳過。"
              echo "------------------------------------------"
              continue
            fi

            # B. 後台分支同步（--force 強行平光歷史衝突）
            if gh repo sync "$TGT_REPO" --force >/dev/null 2>&1; then
              echo "  -> 程式碼同步：成功"
            else
              echo "  -> 程式碼同步：失敗（可能有衝突或分支不同），跳過。"
              echo "------------------------------------------"
              continue
            fi

            # C. 檢查並抓取 Release
            RELEASE_JSON=$(gh release list --repo "$SRC_REPO" --limit 50 --json tagName,publishedAt 2>/dev/null || echo "[]")

            if [ -z "$RELEASE_JSON" ] || [ "$RELEASE_JSON" = "null" ] || [ "$RELEASE_JSON" = "[]" ]; then
              echo "  -> Release狀態：原作者從未發布任何 Release"
              echo "------------------------------------------"
              continue
            fi

            ONE_YEAR_AGO=$(date -d "1 year ago" +%s)
            HAS_NEW_RELEASE=false

            while read -r row; do
              if [ -z "$row" ]; then continue; fi

              TAG=$(echo "$row" | jq -r '.tagName')
              PUB_DATE=$(echo "$row" | jq -r '.publishedAt')

              # 1. 過濾時間：超過一年的不要
              PUB_SEC=$(date -d "$PUB_DATE" +%s 2>/dev/null || echo 0)
              if [ "$PUB_SEC" -lt "$ONE_YEAR_AGO" ]; then
                continue
              fi

              # 2. 檢查自己是不是有了
              if gh release view "$TAG" --repo "$TGT_REPO" >/dev/null 2>&1; then
                continue
              fi

              # 3. 發現未同步版本
              echo "  -> 發現未同步版本：$TAG (發布時間: $PUB_DATE)"
              HAS_NEW_RELEASE=true

              rm -rf sync-assets && mkdir -p sync-assets

              if ! timeout 2m gh release download "$TAG" --repo "$SRC_REPO" --dir sync-assets >/dev/null 2>&1; then
                echo "  -> [提示] 下載附件超時，僅同步文字公告"
              fi

              TITLE=$(gh release view "$TAG" --repo "$SRC_REPO" --json name --template '{{.name}}' 2>/dev/null || echo "$TAG")
              gh release view "$TAG" --repo "$SRC_REPO" --json body --template '{{.body}}' 2>/dev/null > release-note.txt || echo "No description" > release-note.txt

              if [ "$(ls -A sync-assets 2>/dev/null)" ]; then
                if timeout 2m gh release create "$TAG" sync-assets/* --repo "$TGT_REPO" --title "$TITLE" --notes-file release-note.txt >/dev/null 2>&1; then
                  echo "  -> Release同步：成功建立 $TAG"
                else
                  echo "  -> Release同步：失敗 (可能因網路、權限或該版本已有同名標籤)"
                fi
              else
                if timeout 2m gh release create "$TAG" --repo "$TGT_REPO" --title "$TITLE" --notes-file release-note.txt >/dev/null 2>&1; then
                  echo "  -> Release同步：成功建立 $TAG"
                else
                  echo "  -> Release同步：失敗 (可能因網路、權限或該版本已有同名標籤)"
                fi
              fi

              echo "  -> [安全限制] 本次已達 1 個版本上限，其餘版本留待下次處理。"
              rm -rf sync-assets release-note.txt
              break # 抓完這一個立刻踩煞車
            done <<< "$(echo "$RELEASE_JSON" | jq -c '.[]' 2>/dev/null)"

            if [ "$HAS_NEW_RELEASE" = false ]; then
              echo "  -> Release狀態：已是最新狀態，無需更新"
            fi

            echo "------------------------------------------"
          done <<< "$REPOS"

          echo "=== 所有專案全自動巡邏完畢 ==="

      # 防護步驟：使用個人身分送出原生空 Commit，完全不需要第三方 Actions
      - name: Keepalive Workflow
        run: |
          git config --global user.name "bittieshsu"
          git config --global user.email "bittieshsu@users.noreply.github.com"
          git commit --allow-empty -m "chore: maintenance sync-center heartbeat" || true
          git push || true
